<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importer des questions — EDUFORCI</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5fa;margin:0;padding:16px;color:#153A73}
.carte{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h1{font-size:20px;margin-top:0}label{display:block;font-weight:bold;margin-top:14px}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;margin-top:4px}
button{width:100%;margin-top:18px;padding:14px;font-size:16px;font-weight:bold;color:#fff;background:#153A73;border:0;border-radius:10px}
button:disabled{opacity:.5}#etat{margin-top:16px;padding:12px;border-radius:8px;background:#eef2fb;white-space:pre-wrap;font-size:14px}
</style></head><body><div class="carte">
<h1>Importer 30 questions de plus (SVT et PC)</h1>
<p>15 questions supplémentaires par matière (QCM : connaissances, pédagogie, études de cas). Les questions déjà présentes ne sont pas dupliquées.</p>
<label>Nom de la matière SVT (comme les enseignants la saisissent)</label><input id="nomSvt" value="SVT">
<label>Nom de la matière PC (comme les enseignants la saisissent)</label><input id="nomPc" value="PC">
<button id="btn" disabled>Importer</button>
<div id="etat">Vérification de votre accès administrateur...</div>
</div>
<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { doc, getDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
const QUESTIONS = [{"m": "SVT", "categorie": "disciplinaire", "difficulte": "facile", "question": "Quel est l'organe principal de la respiration chez l'être humain ?", "choix": ["Le cœur", "Les poumons", "L'estomac", "Le foie"], "bonne": 2, "explication": "Les échanges gazeux entre l'air et le sang se font dans les alvéoles des poumons."}, {"m": "SVT", "categorie": "disciplinaire", "difficulte": "facile", "question": "Quelle cellule est spécialisée dans la transmission des messages nerveux ?", "choix": ["Le globule blanc", "Le neurone", "La cellule osseuse", "Le globule rouge"], "bonne": 2, "explication": "Le neurone conduit l'influx nerveux."}, {"m": "SVT", "categorie": "disciplinaire", "difficulte": "facile", "question": "Les artères sont des vaisseaux qui transportent le sang :", "choix": ["Du cœur vers les organes", "Des organes vers le cœur", "Uniquement de l'air", "Uniquement de la lymphe"], "bonne": 1, "explication": "Les artères partent du cœur ; les veines y reviennent."}, {"m": "SVT", "categorie": "disciplinaire", "difficulte": "moyen", "question": "La respiration cellulaire se déroule principalement dans :", "choix": ["Les chloroplastes", "Les mitochondries", "Le noyau", "Les lysosomes"], "bonne": 2, "explication": "Les mitochondries libèrent l'énergie à partir du glucose et du dioxygène."}, {"m": "SVT", "categorie": "disciplinaire", "difficulte": "moyen", "question": "Dans une chaîne alimentaire, le producteur primaire est :", "choix": ["L'herbivore", "La plante verte", "Le carnivore", "Le décomposeur"], "bonne": 2, "explication": "La plante verte fabrique sa matière organique par photosynthèse."}, {"m": "SVT", "categorie": "disciplinaire", "difficulte": "moyen", "question": "Le virus du VIH s'attaque principalement :", "choix": ["Aux globules rouges", "Aux lymphocytes T4 du système immunitaire", "Aux neurones", "Aux cellules du foie"], "bonne": 2, "explication": "En détruisant les lymphocytes T4, il affaiblit les défenses de l'organisme."}, {"m": "SVT", "categorie": "disciplinaire", "difficulte": "moyen", "question": "Chez la femme, la fécondation a lieu habituellement dans :", "choix": ["L'utérus", "Le vagin", "La trompe de Fallope (oviducte)", "L'ovaire"], "bonne": 3, "explication": "La rencontre ovule-spermatozoïde se produit dans l'oviducte."}, {"m": "SVT", "categorie": "disciplinaire", "difficulte": "difficile", "question": "Une mutation est :", "choix": ["Un changement durable de la séquence de l'ADN", "Une maladie contagieuse", "Une division cellulaire normale", "Une réaction immunitaire"], "bonne": 1, "explication": "Une mutation modifie l'ADN et peut modifier un caractère."}, {"m": "SVT", "categorie": "disciplinaire", "difficulte": "difficile", "question": "Une personne de groupe sanguin AB (Rhésus compatible) peut recevoir des globules rouges de :", "choix": ["Seulement du groupe AB", "Des groupes A, B, AB et O", "Seulement du groupe O", "Seulement des groupes A et B"], "bonne": 2, "explication": "Le groupe AB n'a pas d'anticorps anti-A ni anti-B : receveur universel pour les globules rouges."}, {"m": "SVT", "categorie": "pedagogie", "difficulte": "moyen", "question": "Pour vérifier qu'un élève a compris une notion, la meilleure question est :", "choix": ["« Avez-vous compris ? »", "« Explique-moi avec tes mots ce que tu as retenu. »", "« Qui n'a rien compris ? »", "« Recopiez la leçon. »"], "bonne": 2, "explication": "La reformulation montre la compréhension réelle."}, {"m": "SVT", "categorie": "pedagogie", "difficulte": "facile", "question": "Un bon schéma d'observation en SVT doit être :", "choix": ["Petit et sans légende", "Titré, légendé et soigné", "Copié sans comprendre", "Colorié sans titre"], "bonne": 2, "explication": "Titre, légendes et propreté rendent le schéma exploitable."}, {"m": "SVT", "categorie": "pedagogie", "difficulte": "moyen", "question": "Pour bien gérer une séance de SVT de 2 heures, il faut :", "choix": ["Improviser selon l'humeur de la classe", "Planifier des objectifs clairs et des phases (introduction, activité, bilan)", "Consacrer tout le temps à la dictée", "Finir plus tôt chaque fois"], "bonne": 2, "explication": "Une séance structurée optimise le temps d'apprentissage."}, {"m": "SVT", "categorie": "etude_de_cas", "difficulte": "moyen", "question": "Un élève pose une question gênante sur la sexualité pendant le cours sur la reproduction. Que faites-vous ?", "choix": ["Le punir devant la classe", "Répondre de façon scientifique, simple et respectueuse, dans le cadre du programme", "Ignorer la question", "Rire avec la classe"], "bonne": 2, "explication": "On répond avec rigueur et respect, en restant dans le cadre scolaire."}, {"m": "SVT", "categorie": "etude_de_cas", "difficulte": "moyen", "question": "Un élève est régulièrement moqué par ses camarades à cause de son apparence. Que faites-vous ?", "choix": ["Ne pas intervenir", "Rappeler fermement les règles de respect, soutenir l'élève et informer la vie scolaire", "Se moquer aussi pour détendre l'ambiance", "Changer l'élève de classe sans rien dire"], "bonne": 2, "explication": "Une moquerie répétée est du harcèlement : intervenir et alerter."}, {"m": "SVT", "categorie": "etude_de_cas", "difficulte": "moyen", "question": "Un élève est absent depuis deux semaines sans explication. Que faites-vous ?", "choix": ["Le rayer des listes", "Signaler l'absence à la vie scolaire et contacter la famille pour comprendre la situation", "L'ignorer", "Lui mettre zéro à tous les devoirs"], "bonne": 2, "explication": "On cherche à comprendre et à accompagner le retour de l'élève."}, {"m": "PC", "categorie": "disciplinaire", "difficulte": "facile", "question": "Quel appareil mesure la tension électrique ?", "choix": ["Le voltmètre", "L'ampèremètre", "Le thermomètre", "Le dynamomètre"], "bonne": 1, "explication": "Le voltmètre se branche en dérivation."}, {"m": "PC", "categorie": "disciplinaire", "difficulte": "facile", "question": "Quelle est la formule chimique du dioxyde de carbone ?", "choix": ["CO", "CO2", "C2O", "O2C"], "bonne": 2, "explication": "Une molécule : 1 atome de carbone et 2 atomes d'oxygène."}, {"m": "PC", "categorie": "disciplinaire", "difficulte": "facile", "question": "Un mélange d'eau et d'huile est :", "choix": ["Homogène", "Hétérogène", "Un corps pur", "Un gaz"], "bonne": 2, "explication": "On distingue deux phases : le mélange est hétérogène."}, {"m": "PC", "categorie": "disciplinaire", "difficulte": "moyen", "question": "Quel est le poids d'un objet de masse 5 kg (g = 10 N/kg) ?", "choix": ["0,5 N", "5 N", "50 N", "500 N"], "bonne": 3, "explication": "P = m × g = 5 × 10 = 50 N."}, {"m": "PC", "categorie": "disciplinaire", "difficulte": "moyen", "question": "À pression normale, l'eau pure bout à :", "choix": ["0 °C", "50 °C", "100 °C", "212 °C"], "bonne": 3, "explication": "La température d'ébullition de l'eau est de 100 °C."}, {"m": "PC", "categorie": "disciplinaire", "difficulte": "moyen", "question": "Dans un circuit en série, l'intensité du courant est :", "choix": ["La même en tous les points", "La somme des intensités de chaque branche", "Plus faible après chaque dipôle", "Nulle"], "bonne": 1, "explication": "Dans un circuit en série, l'intensité est identique partout."}, {"m": "PC", "categorie": "disciplinaire", "difficulte": "moyen", "question": "La réaction entre un acide et une base produit :", "choix": ["Un métal et de l'hydrogène", "Un sel et de l'eau", "Un gaz et de la lumière", "Un alcool"], "bonne": 2, "explication": "C'est la neutralisation : acide + base donne sel + eau."}, {"m": "PC", "categorie": "disciplinaire", "difficulte": "difficile", "question": "Quelle est l'énergie cinétique d'un objet de 2 kg se déplaçant à 3 m/s ?", "choix": ["3 J", "6 J", "9 J", "18 J"], "bonne": 3, "explication": "Ec = ½ × m × v² = ½ × 2 × 9 = 9 J."}, {"m": "PC", "categorie": "disciplinaire", "difficulte": "difficile", "question": "Un appareil de 100 W fonctionne pendant 2 heures. L'énergie consommée est :", "choix": ["0,02 kWh", "0,2 kWh", "2 kWh", "200 kWh"], "bonne": 2, "explication": "E = P × t = 100 W × 2 h = 200 Wh = 0,2 kWh."}, {"m": "PC", "categorie": "pedagogie", "difficulte": "moyen", "question": "Des élèves pensent qu'un objet lourd tombe plus vite qu'un objet léger. Que faire ?", "choix": ["Leur dire qu'ils ont tort", "Faire l'expérience de la chute de deux objets (avec mesure) et discuter des résultats", "Ne pas en parler", "Leur donner la formule à apprendre"], "bonne": 2, "explication": "Confronter l'idée aux faits permet de corriger les conceptions erronées."}, {"m": "PC", "categorie": "pedagogie", "difficulte": "moyen", "question": "Un bon compte rendu de TP contient :", "choix": ["Seulement les résultats", "Le but, le matériel, la méthode, les observations et la conclusion", "Uniquement un schéma", "Le cours recopié"], "bonne": 2, "explication": "La démarche scientifique se retrouve dans toute la structure."}, {"m": "PC", "categorie": "pedagogie", "difficulte": "moyen", "question": "Pour que les élèves relient la physique-chimie à leur vie quotidienne, il est préférable de :", "choix": ["Rester sur des définitions abstraites", "Utiliser des exemples concrets (électricité à la maison, cuisine, santé)", "Éviter les exemples pour gagner du temps", "Donner uniquement des exercices de calcul"], "bonne": 2, "explication": "Le lien avec le quotidien donne du sens aux notions."}, {"m": "PC", "categorie": "etude_de_cas", "difficulte": "moyen", "question": "Vous sentez une forte odeur de gaz dans la salle de TP. Que faites-vous ?", "choix": ["Allumer pour vérifier", "Fermer l'arrivée de gaz, ouvrir portes et fenêtres, faire évacuer sans allumer ni éteindre d'appareil électrique", "Continuer le TP", "Demander à un élève de chercher la fuite"], "bonne": 2, "explication": "Ni flamme ni étincelle : couper le gaz, aérer, évacuer, alerter."}, {"m": "PC", "categorie": "etude_de_cas", "difficulte": "moyen", "question": "Un élève brillant s'ennuie et perturbe la classe. Que faites-vous ?", "choix": ["Le punir", "Lui proposer des exercices d'approfondissement ou un rôle de tuteur", "L'exclure", "L'ignorer"], "bonne": 2, "explication": "Un défi adapté canalise son énergie."}, {"m": "PC", "categorie": "etude_de_cas", "difficulte": "moyen", "question": "Plusieurs élèves échouent en physique à cause de faiblesses en calcul. Que faites-vous ?", "choix": ["Continuer sans rien changer", "Prévoir un temps de remédiation sur les bases (proportionnalité, conversions) avec des exercices ciblés", "Supprimer les calculs du cours", "Leur dire de se débrouiller"], "bonne": 2, "explication": "On traite la cause de l'échec pour permettre la progression."}];
const etat = (t) => { document.getElementById("etat").textContent = t; };
const btn = document.getElementById("btn");
onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "connexion-admin.html"; return; }
    try {
        const s = await getDoc(doc(db, "admins", user.uid));
        if (!s.exists()) { etat("Accès refusé : ce compte n'est pas administrateur."); return; }
        etat("Prêt. " + QUESTIONS.length + " questions à importer.");
        btn.disabled = false;
    } catch (e) { etat("Erreur : " + (e.code || e.message)); }
});
btn.addEventListener("click", async () => {
    btn.disabled = true;
    const noms = { SVT: document.getElementById("nomSvt").value.trim(), PC: document.getElementById("nomPc").value.trim() };
    if (!noms.SVT || !noms.PC) { etat("Remplissez les deux noms de matière."); btn.disabled = false; return; }
    try {
        etat("Lecture de la banque existante...");
        const snap = await getDocs(collection(db, "questionsRecrutement"));
        const existantes = new Set(snap.docs.map(d => (d.data().matiere || "") + "||" + (d.data().question || "")));
        let ajoutees = 0, ignorees = 0, echecs = 0;
        for (const q of QUESTIONS) {
            const matiere = noms[q.m];
            if (existantes.has(matiere + "||" + q.question)) { ignorees++; continue; }
            try {
                await addDoc(collection(db, "questionsRecrutement"), {
                    type: "qcm", matiere, difficulte: q.difficulte, categorie: q.categorie,
                    question: q.question, choix: q.choix, reponseCorrecte: q.bonne - 1,
                    explication: q.explication, bareme: null, corrigeIndicatif: null
                });
                ajoutees++;
            } catch (e) { echecs++; console.error(e); etat("Erreur sur une question : " + (e.code || e.message)); }
            etat("Import en cours... " + (ajoutees + ignorees + echecs) + " / " + QUESTIONS.length);
        }
        etat("Terminé ✅\nAjoutées : " + ajoutees + "\nDéjà présentes : " + ignorees + "\nÉchecs : " + echecs + "\n\nVous pouvez maintenant supprimer ce fichier de GitHub.");
    } catch (e) { etat("Erreur : " + (e.code || e.message)); btn.disabled = false; }
});
</script></body></html>

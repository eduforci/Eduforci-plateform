<!DOCTYPE html>
<html lang="fr">
<head>
<script src="js/notify.js?v=5"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents | EDUFORCI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:linear-gradient(rgba(5,32,78,.78),rgba(5,32,78,.78)),url("hero.jpg") center center/cover fixed no-repeat;display:flex;}
.sidebar{width:260px;height:100vh;background:#153A73;color:white;padding:30px 20px;position:fixed;left:0;top:0;overflow-y:auto;}
.sidebar img{height:65px;display:block;margin:auto;margin-bottom:25px;}
.sidebar a{display:block;color:white;text-decoration:none;padding:14px;margin-bottom:8px;border-radius:10px;transition:.3s;}
.sidebar a:hover,.sidebar a.actif{background:#0B63F6;}
.main{margin-left:260px;padding:35px;width:100%;}
.welcome{background:white;padding:30px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.08);margin-bottom:30px;}
.welcome h1{color:#153A73;margin-bottom:6px;}
.filtres{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap;}
.filtres input,.filtres select{padding:12px;border:1px solid #d5dbe8;border-radius:10px;font-size:14px;flex:1;min-width:160px;}
.doc{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #eee;}
.doc small{color:#777;display:block;margin-top:3px;}
.badge{display:inline-block;background:#eaf1ff;color:#0B63F6;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;}
.btn{background:#0B63F6;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap;}
.btn:disabled{opacity:.6;cursor:wait;}
.menu-toggle{display:none;position:fixed;top:20px;left:20px;z-index:100000;background:#153A73;color:#fff;border:none;width:48px;height:48px;border-radius:12px;font-size:20px;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25);cursor:pointer;}
.sidebar-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9998;}
@media (max-width:900px){
.menu-toggle{display:flex;}
.sidebar{transform:translateX(-100%);transition:transform .3s ease;z-index:9999;}
.sidebar.ouvert{transform:translateX(0);}
.sidebar-overlay.ouvert{display:block;}
.main{margin-left:0!important;padding:20px!important;padding-top:85px!important;max-width:100%!important;}
.doc{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>
<a href="index.html" title="Retour à l'accueil" style="position:fixed;top:20px;right:20px;background:#153A73;color:white;padding:12px 20px;border-radius:30px;text-decoration:none;font-size:14px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:99999;display:flex;align-items:center;gap:6px;">🏠 Accueil</a>

<button class="menu-toggle" id="menuToggleEduforci" aria-label="Menu">☰</button>
<div class="sidebar-overlay" id="sidebarOverlayEduforci"></div>
<div class="sidebar">
<img src="logo.png" alt="EDUFORCI">
<a href="dashboard-enseignant.html">🏠 Tableau de bord</a>
<a href="mon-profil-enseignant.html">👤 Mon profil</a>
<a href="mes-matieres-enseignant.html">📚 Mes matières</a>
<a href="mes-disponibilites-enseignant.html">📅 Mes disponibilités</a>
<a href="missions-proposees-enseignant.html">🎯 Missions proposées</a>
<a href="documents-enseignant.html" class="actif">📁 Documents</a>
<a href="notifications-enseignant.html">🔔 Notifications</a>
<a href="mes-candidatures-enseignant.html">📝 Ma candidature</a>
<a href="certificat-enseignant.html">🎓 Mon certificat</a>
<a href="certificat-enseignant.html">🏆 Mes reconnaissances</a>
<a href="avis-enseignant.html">⭐ Avis</a>
<a href="parametres-enseignant.html">⚙️ Paramètres</a>
<a href="#" id="btnDeconnexion">🚪 Déconnexion</a>
</div>

<div class="main">
<div class="welcome">
<h1>📁 Documents</h1>
<p style="color:#666;font-size:14px;">Documents mis à votre disposition par EDUFORCI.</p>
<div class="filtres">
<input type="text" id="recherche" placeholder="🔍 Rechercher un document…">
<select id="filtreCat"><option value="">Toutes les catégories</option></select>
</div>
<div id="liste">⏳ Chargement…</div>
</div>
</div>

<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import { enregistrerDeconnexion, verifierDeconnexionForcee } from "./js/securite-suivi.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTaille = o => o > 1048576 ? (o/1048576).toFixed(1) + " Mo" : Math.ceil(o/1024) + " Ko";
let docs = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "connexion-enseignant.html"; return; }

  if (await verifierDeconnexionForcee(db, user.uid)) {
    await signOut(auth);
    alert("Votre session a été fermée à distance par un administrateur.");
    window.location.href = "connexion-enseignant.html";
    return;
  }

  const ens = await getDoc(doc(db, "enseignants", user.uid));
  if (!ens.exists()) { window.location.href = "connexion-enseignant.html"; return; }

  try {
    const [pourTous, pourMoi] = await Promise.all([
      getDocs(query(collection(db, "documentsEnseignants"), where("cible", "==", "tous"))),
      getDocs(query(collection(db, "documentsEnseignants"), where("ciblesUids", "array-contains", user.uid)))
    ]);
    const map = new Map();
    [pourTous, pourMoi].forEach(s => s.forEach(d => map.set(d.id, { id: d.id, ...d.data() })));
    docs = [...map.values()].sort((a, b) => b.dateCreation.localeCompare(a.dateCreation));
  } catch (err) {
    console.error(err);
    $("liste").textContent = "Impossible de charger les documents.";
    return;
  }

  [...new Set(docs.map(d => d.categorie))].sort().forEach(c => {
    const o = document.createElement("option"); o.textContent = c; $("filtreCat").appendChild(o);
  });
  afficher();
});

function afficher() {
  const q = $("recherche").value.toLowerCase().trim();
  const cat = $("filtreCat").value;
  const res = docs.filter(d =>
    (!cat || d.categorie === cat) &&
    (!q || ((d.titre || "") + " " + (d.description || "") + " " + (d.nomFichier || "")).toLowerCase().includes(q))
  );
  const L = $("liste");
  if (!res.length) { L.textContent = docs.length ? "Aucun résultat." : "Aucun document disponible pour le moment."; return; }
  L.innerHTML = "";
  res.forEach(x => {
    const div = document.createElement("div");
    div.className = "doc";
    div.innerHTML = `<div>
      <strong>${esc(x.titre)}</strong> <span class="badge">${esc(x.categorie)}</span>
      ${x.description ? `<small>${esc(x.description)}</small>` : ""}
      <small>${esc(x.nomFichier)} · ${fmtTaille(x.taille || 0)} · ${new Date(x.dateCreation).toLocaleDateString("fr-FR")}</small>
    </div>`;
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = "⬇ Télécharger";
    b.onclick = () => telecharger(x, b);
    div.appendChild(b);
    L.appendChild(div);
  });
}

async function telecharger(x, b) {
  b.disabled = true; b.textContent = "Téléchargement…";
  try {
    let b64 = "";
    for (let i = 0; i < x.nbParties; i++) {
      const p = await getDoc(doc(db, "documentsEnseignants", x.id, "parties", String(i)));
      b64 += p.data().data;
    }
    const blob = await (await fetch(`data:${x.typeMime};base64,${b64}`)).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = x.nomFichier;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (err) {
    console.error(err);
    alert("Erreur de téléchargement : " + err.message);
  }
  b.disabled = false; b.textContent = "⬇ Télécharger";
}

$("recherche").addEventListener("input", afficher);
$("filtreCat").addEventListener("change", afficher);

$("btnDeconnexion").addEventListener("click", async (e) => {
  e.preventDefault();
  if (auth.currentUser) await enregistrerDeconnexion(db, { uid: auth.currentUser.uid, role: "enseignant" });
  await signOut(auth);
  window.location.href = "connexion-enseignant.html";
});
</script>
<script>
(function(){
  const btn = document.getElementById("menuToggleEduforci");
  const overlay = document.getElementById("sidebarOverlayEduforci");
  const sidebar = document.querySelector(".sidebar");
  function ouvrir(){ sidebar.classList.add("ouvert"); overlay.classList.add("ouvert"); }
  function fermer(){ sidebar.classList.remove("ouvert"); overlay.classList.remove("ouvert"); }
  btn.addEventListener("click", function(){ sidebar.classList.contains("ouvert") ? fermer() : ouvrir(); });
  overlay.addEventListener("click", fermer);
  sidebar.querySelectorAll("a").forEach(function(a){ a.addEventListener("click", fermer); });
})();
</script>
</body>
</html>

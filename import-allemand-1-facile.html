const btn = document.getElementById("btn");
onAuthStateChanged(auth, async (user) => {
if (!user) { window.location.href = "connexion-admin.html"; return; }
try {
const s = await getDoc(doc(db, "admins", user.uid));
if (!s.exists()) { etat("Accès refusé : ce compte n'est pas administrateur."); return; }
etat("Prêt. " + QUESTIONS.length + " questions à importer.");
btn.disabled = false;
} catch (e) { etat("Erreur : " + (e.code || e.message)); }
}, (e) => { etat("Erreur d'authentification : " + (e.code || e.message)); });
btn.addEventListener("click", async () => {
btn.disabled = true;
const noms = { MAT: document.getElementById("nomMatiere").value.trim() };
if (!noms.MAT) { etat("Remplissez le nom de la matière."); btn.disabled = false; return; }
try {
etat("Lecture de la banque existante...");
const snap = await getDocs(collection(db, "questionsRecrutement"));
const existantes = new Set(snap.docs.map(d => (d.data().matiere || "") + "||" + (d.data().question || "")));
let ajoutees = 0, ignorees = 0, echecs = 0;
for (const q of QUESTIONS) {
const matiere = noms[q.m];
if (existantes.has(matiere + "||" + q.question)) { ignorees++; continue; }
try {
await addDoc(collection(db, "questionsRecrutement"), {
type: "qcm", matiere, difficulte: q.difficulte, categorie: q.categorie,
question: q.question, choix: q.choix, reponseCorrecte: q.bonne - 1,
explication: q.explication, bareme: null, corrigeIndicatif: null
});
ajoutees++;
} catch (e) { echecs++; console.error(e); etat("Erreur sur une question : " + (e.code || e.message)); }
etat("Import en cours... " + (ajoutees + ignorees + echecs) + " / " + QUESTIONS.length);
}
etat("Terminé ✅\nAjoutées : " + ajoutees + "\nDéjà présentes : " + ignorees + "\nÉchecs : " + echecs + "\n\nVous pouvez maintenant supprimer ce fichier de GitHub.");
} catch (e) { etat("Erreur : " + (e.code || e.message)); btn.disabled = false; }
});
